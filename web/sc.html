<!DOCTYPE html>
<html>
<head>
<title>Simple Calculator</title>
<script>
function calculate(operation) {
let a = Number(document.getElementById("num1").value);
let b = Number(document.getElementById("num2").value);
let result;
if (operation === "add") { result = a + b; }
else if (operation === "sub") { result = a - b; }
else if (operation === "mul") { result = a * b; }
else if (operation === "div") { result = a / b; }
else { result = "Invalid operation"; }
document.getElementById("result").innerHTML = "Result: " + result;
}
</script>
</head>
<body>
<h2>Simple Calculator</h2>
<label>Enter First number: </label>
<input type="number" id="num1"><br><br>
<label>Enter second number: </label>
<input type="number" id="num2"><br><br>
<button onclick="calculate('add')">+</button>
<button onclick="calculate('sub')">-</button>
<button onclick="calculate('mul')">*</button>
<button onclick="calculate('div')">/</button>
<h3 id="result">Result: </h3>
</body>
</html>
