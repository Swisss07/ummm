<!DOCTYPE html>
<html>
<head>
<title>Registration Form Validation</title>
<script>
function validateform() {
let name = document.getElementById("name").value;
let age = document.getElementById("age").value;
let password = document.getElementById("password").value;
let repassword = document.getElementById("repassword").value;
if (name === "") { alert("Name is mandatory"); return false; }
if (age === "") { alert("Age is mandatory"); return false; }
let namepattern = /^[A-Za-z\s]+$/;
if (!namepattern.test(name)) { alert("Name should contain only characters"); return false; }
if (password !== repassword) { alert("Password & re-enter password should be same"); return false; }
alert("Registration successful");
return true;
}
</script>
</head>
<body>
<h2>Registration Form</h2>
<form onsubmit="return validateform()">
Name: <input type="text" id="name"><br><br>
Age: <input type="number" id="age"><br><br>
Password: <input type="password" id="password"><br><br>
Re-enter password: <input type="password" id="repassword"><br><br>
<input type="submit" value="Register">
</form>
</body>
</html>
