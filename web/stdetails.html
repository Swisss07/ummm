<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student Details - Angular JS</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-app="studentApp" ng-controller="studentController">
<h2>Student Details Application</h2>
<label>Enter Student Name : </label>
<input type="text" ng-model="studentName"><br><br>
<label>Enter Student Age : </label>
<input type="number" ng-model="studentAge"><br><br>
<label>Enter Course : </label>
<input type="text" ng-model="studentCourse"><br><br>
<h3>Student Information</h3>
<p>Name: {{ studentName }}</p>
<p>Age: {{ studentAge }}</p>
<p>Course: {{ studentCourse }}</p>
<script>
var app = angular.module("studentApp", []);
app.controller("studentController", function($scope) {
$scope.studentName = "";
$scope.studentAge = "";
$scope.studentCourse = "";
});
</script>
</body>
</html>
