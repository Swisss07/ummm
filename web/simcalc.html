<!DOCTYPE html>
<html ng-app="myApp">
<head>
<title>AngularJS Calculator</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="myCtrl">
<h2>Simple AngularJS Calculator</h2>
First number: <input type="number" ng-model="num1"><br><br>
Second number: <input type="number" ng-model="num2"><br><br>
<button ng-click="calculate('+')">Addition</button>
<button ng-click="calculate('-')">subtraction</button>
<button ng-click="calculate('*')">Multiplication</button>
<button ng-click="calculate('/')">Division</button>
<h3>Result : {{ result }}</h3>
<script>
var app = angular.module("myApp", []);
app.controller("myCtrl", function($scope) {
$scope.num1 = 0;
$scope.num2 = 0;
$scope.result = 0;
$scope.calculate = function(op) {
if (op === '+') { $scope.result = $scope.num1 + $scope.num2; }
else if (op === '-') { $scope.result = $scope.num1 - $scope.num2; }
else if (op === '*') { $scope.result = $scope.num1 * $scope.num2; }
else if (op === '/') {
if ($scope.num2 !== 0) { $scope.result = $scope.num1 / $scope.num2; }
else { $scope.result = "Cannot divide by zero"; }
}
};
});
</script>
</body>
</html>
